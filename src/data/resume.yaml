basics:
  name: "Laura Naccarato"
  label: "Senior Full-Stack Engineer"
  url: "https://lauranaccarato.com"
  summary: "Senior Full-Stack Engineer with 10 years building production-grade B2B SaaS and high-stakes consumer web applications. Strong ownership across architecture, performance, and automation in live-production environments, with hands-on experience leveraging AI-assisted development tools to accelerate delivery while maintaining quality, security, and maintainability."
  profiles:
    - network: "GitHub"
      url: "https://github.com/laura-naccarato"
    - network: "LinkedIn"
      url: "https://www.linkedin.com/in/lnaccarato/"

work:
  - company: "Rivalry"
    position: "Software Engineer (Front-End Focus)"
    startDate: "2024"
    endDate: ""
    highlights:
      - "Led incremental rewrite of mission-critical wallet infrastructure on a live production platform, applying scalable patterns and feature-flagged delivery to maintain stability, security, and reliability under continuous traffic."
      - "Leveraged agentic AI-assisted coding tools as part of daily workflow to accelerate delivery velocity, critically prompting, reviewing, and refining AI-generated code to meet production standards for quality and maintainability."
      - "Designed reusable component architecture across user-facing promotional systems — Races, Tournaments, VIP program, back-office tooling, pre-rollover bonuses — supporting engagement and monetization at scale."
      - "Modernized customer-facing UI surfaces — navigation, game tiles, homepage, reusable carousel — and contributed to the Nuxt2 → Nuxt3 migration, improving performance and long-term maintainability."
      - "Automated Hub88 → Strapi ingestion pipeline (slug deduplication + scheduled imports), increasing content reliability and reducing manual operational work."
      - "Collaborated cross-functionally with design, product, and marketing stakeholders to deliver time-sensitive branded experiences under tight deadlines."
      - "Took on expanded ownership following team restructuring, independently delivering complex front-end initiatives under evolving requirements."

  - company: "Carbonhound"
    position: "Founding Web Developer"
    startDate: "2022"
    endDate: "2024"
    highlights:
      - "Founding engineer on a B2B SaaS platform — owned front-end architecture, full-stack feature delivery, and design-to-code implementation in a fast-moving, growth-stage environment."
      - "Architected data-driven reporting workflows in React, integrating Node services and analytics systems to support customer compliance and carbon accounting use cases."
      - "Designed UI and backend automation reducing manual client operations, including automated report generation and customer onboarding workflows that scaled with the customer base."
      - "Represented the company at public events, engaging with potential investors and stakeholders."

  - company: "CrowdRiff"
    position: "Senior Full Stack Developer"
    startDate: "2018"
    endDate: "2022"
    highlights:
      - "Led development of a BigQuery/PubSub analytics pipeline to process backend service data at scale, supporting performance monitoring and operational visibility."
      - "Mentored engineers and strengthened internal documentation practices, supporting team velocity and knowledge sharing."
      - "Built and published public React-based NPM packages, enabling external client integrations across customer-facing applications."
      - "Contributed to improvements in story recommendation systems supporting content personalization."

  - company: "Klick"
    position: "Intermediate Web Developer"
    startDate: "2017"
    endDate: "2018"
    highlights:
      - "Maintained and extended an internal enterprise management platform supporting large-scale client operations."

  - company: "Idea Couture"
    position: "Web Developer"
    startDate: "2015"
    endDate: "2016"
    highlights:
      - "Built websites for clients including the Aviva Community Fund, delivering responsive, customer-facing web experiences."

