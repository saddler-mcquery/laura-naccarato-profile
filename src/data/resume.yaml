basics:
  name: "Laura Naccarato"
  label: "Senior Frontend Developer"
  url: "https://laura-naccarato.github.io"
  summary: "Senior Frontend Developer with 10+ years of experience building customer-facing web applications in agile environments. Expertise in React and Vue/Nuxt ecosystems, continuous delivery, and scalable component architecture. Proven track record in growth-oriented product development — promotional systems, experimentation, and user engagement features — with strong cross-functional collaboration and mentorship."
  profiles:
    - network: "GitHub"
      url: "https://github.com/laura-naccarato"
    - network: "LinkedIn"
      url: "https://linkedin.com/in/laura-naccarato"

work:
  - company: "Rivalry"
    position: "Software Engineer (Front-End Focus)"
    startDate: "2024"
    endDate: ""
    highlights:
      - "Led incremental rewrite of mission-critical wallet infrastructure in a live production platform, shipping feature-flagged releases through continuous delivery while maintaining legacy stability."
      - "Designed scalable promotional and engagement systems — Races, Tournaments, VIP program, and bonus mechanics — using reusable component architecture to drive user acquisition and retention."
      - "Contributed to the Nuxt 2 → Nuxt 3 migration, modernizing server-side rendering, improving performance, and strengthening maintainability across the platform."
      - "Automated content ingestion pipeline (slug deduplication + scheduled imports), increasing data reliability and reducing manual operational overhead."
      - "Collaborated cross-functionally with design, marketing, and product stakeholders to deliver a branded microsite under tight deadline."
      - "Took on expanded ownership following team restructuring, independently delivering complex front-end initiatives under evolving requirements."

  - company: "Carbonhound"
    position: "Founding Web Developer"
    startDate: "2022"
    endDate: "2024"
    highlights:
      - "Founding engineer solely responsible for front-end architecture and full-stack feature delivery of an enterprise carbon accounting SaaS platform built in React and Node.js."
      - "Owned end-to-end design-to-code implementation, translating Figma designs into production-ready UI with high visual fidelity through close collaboration with the design team."
      - "Architected and maintained the carbon-client front-end codebase, establishing code standards, conducting PR reviews, and driving tech debt strategy to keep the platform scalable."
      - "Built automated unit testing coverage and owned QA and regression processes, ensuring release confidence across a rapidly evolving codebase."
      - "Architected data-driven reporting workflows integrating React front-end with Node services and analytics instrumentation to support business intelligence use cases."
      - "Designed and deployed automated onboarding and report generation workflows, reducing manual client operations and improving user conversion."
      - "Handled deployments and served as DevOps backup, maintaining platform reliability; authored technical documentation to support team knowledge sharing."
      - "Collaborated with product, design, and business stakeholders; represented the company at public events to investors and partners."

  - company: "CrowdRiff"
    position: "Senior Full Stack Developer"
    startDate: "2018"
    endDate: "2022"
    highlights:
      - "Led development of a BigQuery/PubSub analytics pipeline to process backend service data at scale, supporting experimentation and product insights."
      - "Contributed to content recommendation and personalization systems, iterating on A/B tested approaches to improve engagement."
      - "Built and published public React-based NPM packages enabling external client integrations and self-service adoption."
      - "Mentored engineers, championed software best practices, and strengthened internal documentation and testing culture."

  - company: "Klick"
    position: "Intermediate Web Developer"
    startDate: "2017"
    endDate: "2018"
    highlights:
      - "Maintained and extended an internal enterprise management platform supporting large-scale client operations in an agile development environment."

  - company: "Idea Couture"
