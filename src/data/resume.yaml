basics:
  name: "Laura Naccarato"
  label: "Senior Frontend Engineer"
  location: "Toronto, ON, Canada"
  url: "https://lauranaccarato.com"
  summary: "Senior Frontend Engineer with 10 years shipping clean, well-tested JavaScript, React, and TypeScript across early-stage B2B SaaS and high-traffic consumer platforms. I break complex problems into incremental, confidently shipped solutions, own frontend architecture, and build reusable component libraries and frontend testing systems — unit, integration, regression, and acceptance — that let teams ship fast without breaking things. I thrive in fast-paced, engineering-first startups where taking ownership of the product and doing things the right way matter, and I run a genuinely agentic AI workflow (Claude, Cursor) daily across building, testing, and reviewing — without compromising the quality bar."
  profiles:
    - network: "GitHub"
      url: "https://github.com/laura-naccarato"
    - network: "LinkedIn"
      url: "https://www.linkedin.com/in/lnaccarato/"

work:
  - company: "Rivalry"
    position: "Software Engineer (Front-End Focus)"
    startDate: "2024"
    endDate: "2026"
    highlights:
      - "Took full ownership of shared, reusable, well-tested component frameworks in TypeScript across revenue-driving customer-facing surfaces — Races, Tournaments, VIP program, pre-rollover bonuses, back-office tooling — consolidating one-off UI into consistent patterns other product teams build on to ship production-quality UI faster."
      - "Led an incremental rewrite of mission-critical wallet infrastructure on a live, regulated production platform — breaking it into feature-flagged steps with CI/CD quality gates to ship often and confidently under continuous traffic — real money, real stakes, no incidents."
      - "Drove a frontend architecture migration (Nuxt2 → Nuxt3) across a high-traffic consumer platform, defining application structure and shared abstractions and modernizing core UI surfaces (navigation, game tiles, homepage, reusable carousel) while keeping the product stable for users."
      - "Wrote clean code and reusable abstractions integrating RESTful and GraphQL APIs, and troubleshooted and supported production applications under real user load."
      - "Partnered with product owners, designers, and marketing stakeholders in a fast-paced, cross-functional agile team to take features from planning through delivery, shipping time-sensitive branded experiences on tight deadlines."
      - "Automated a Hub88 → Strapi content ingestion pipeline (slug deduplication, scheduled imports), writing maintainable code that improved reliability and removed recurring manual operational work."
      - "Run a genuinely agentic AI development workflow (Claude, Cursor) across the full lifecycle — building, testing, and reviewing — pushing the tools hard while reading diffs line-by-line and writing the tests, so speed never comes at the cost of production standards; established review practices teammates could adopt."

  - company: "Carbonhound"
    position: "Founding Web Developer"
    startDate: "2022"
    endDate: "2024"
    highlights:
      - "Founding engineer on an early-stage B2B SaaS platform — established the frontend architecture and engineering practices from the ground up in React and TypeScript, shaping both the product and how the team built under the ambiguity and shifting priorities of a growth-stage startup."
      - "Built reusable React component systems and data-driven reporting workflows against RESTful services, partnering directly with product and design to deliver customer onboarding experiences from concept through release."
      - "Designed automated report generation and onboarding workflows that replaced manual client operations and scaled as the customer base grew."
      - "Partnered cross-functionally with product, design, and leadership, and represented the company publicly with investors and stakeholders."

  - company: "CrowdRiff"
    position: "Senior Full Stack Developer"
    startDate: "2018"
    endDate: "2022"
    highlights:
      - "Architected and published public React NPM packages — well-tested, documented, reusable component libraries with stable APIs adopted across internal teams and external client integrations, designed to hold up as more people build on them."
      - "Reviewed pull requests, mentored engineers on component patterns, and advocated for clean code, testing, and shared standards that raised the quality bar and made future development faster."
      - "Strengthened documentation practices and frontend tooling, supporting team self-service, onboarding, and knowledge sharing across engineering."
      - "Contributed to improvements in story recommendation systems supporting content personalization at scale."
      - "Led development of a BigQuery/PubSub data pipeline processing backend service data at scale to support operational visibility and performance monitoring."

  - company: "Klick"
    position: "Intermediate Web Developer"
    startDate: "2017"
    endDate: "2018"
    highlights:
      - "Maintained and extended an internal enterprise management platform supporting large-scale client operations."

  - company: "Idea Couture"
    position: "Web Developer"
    startDate: "2015"
    endDate: "2016"
    highlights:
      - "Built responsive, cross-browser customer-facing websites for clients including the Aviva Community Fund, with attention to clean, maintainable markup across desktop and mobile."

